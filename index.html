<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa ABC - Boletines</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF8C42 0%, #6BCF7F 50%, #4FC3F7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 25px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.25);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 48px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .logo .letra-a {
            color: #FF8C42;
            text-shadow: 2px 2px 4px rgba(255,140,66,0.3);
        }
        
        .logo .letra-b {
            color: #6BCF7F;
            text-shadow: 2px 2px 4px rgba(107,207,127,0.3);
        }
        
        .logo .letra-c {
            color: #4FC3F7;
            text-shadow: 2px 2px 4px rgba(79,195,247,0.3);
        }
        
        .logo p {
            color: #666;
            font-size: 18px;
            font-weight: 500;
        }
        
        .welcome-box {
            background: linear-gradient(135deg, #FFF3E0 0%, #E8F5E9 50%, #E1F5FE 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 5px solid #FF8C42;
        }
        
        .welcome-box h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 10px;
        }
        
        .welcome-box p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .form-section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 4px solid #6BCF7F;
        }
        
        .form-section.notas {
            border-left-color: #FF8C42;
        }
        
        .form-section.asistencia {
            border-left-color: #4FC3F7;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-icon {
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #6BCF7F;
            box-shadow: 0 0 0 3px rgba(107,207,127,0.1);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .promedio-display {
            background: linear-gradient(135deg, #6BCF7F 0%, #4FC3F7 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        
        .promedio-display.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .promedio-display strong {
            font-size: 24px;
            display: block;
            margin-top: 5px;
        }
        
        .ausentismo-display {
            background: linear-gradient(135deg, #4FC3F7 0%, #FF8C42 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        
        .ausentismo-display.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        .ausentismo-display strong {
            font-size: 24px;
            display: block;
            margin-top: 5px;
        }
        
        .bimestre-selector {
            margin-bottom: 20px;
        }
        
        .bimestre-selector label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
        }
        
        .bimestre-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .bimestre-btn {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            font-weight: 600;
            color: #666;
        }
        
        .bimestre-btn:hover {
            border-color: #6BCF7F;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(107,207,127,0.2);
        }
        
        .bimestre-btn.selected {
            border-color: #6BCF7F;
            background: linear-gradient(135deg, #6BCF7F 0%, #4FC3F7 100%);
            color: white;
            transform: scale(1.05);
        }
        
        .upload-area {
            border: 3px dashed #6BCF7F;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #f8fff9 0%, #f0f9ff 100%);
        }
        
        .upload-area:hover {
            border-color: #4FC3F7;
            background: linear-gradient(135deg, #f0f9ff 0%, #fff8f0 100%);
            transform: translateY(-2px);
        }
        
        .upload-area.dragover {
            border-color: #FF8C42;
            background: #fff8f0;
        }
        
        .upload-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .upload-text {
            color: #666;
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .upload-subtext {
            color: #999;
            font-size: 14px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .preview-area {
            margin-top: 20px;
            display: none;
        }
        
        .preview-item {
            background: linear-gradient(135deg, #e8f5e9 0%, #e1f5fe 100%);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid #6BCF7F;
        }
        
        .preview-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .preview-icon {
            font-size: 30px;
        }
        
        .preview-name {
            font-size: 14px;
            color: #333;
            font-weight: 600;
        }
        
        .remove-btn {
            background: #FF8C42;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .remove-btn:hover {
            background: #ff6b1a;
            transform: scale(1.05);
        }
        
        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #FF8C42 0%, #6BCF7F 50%, #4FC3F7 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>
                <span class="letra-a">A</span><span class="letra-b">B</span><span class="letra-c">C</span>
            </h1>
            <p>Programa ABC - Sistema de Boletines</p>
        </div>
        
        <div class="welcome-box">

        <div class="error-message" id="errorMessage"></div>

                <span class="section-icon">👤</span>

                        <option value="7">7° Grado</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="ciclo">Ciclo lectivo *</label>
                    <select id="ciclo" required>
                        <option value="">Seleccioná el año</option>
                        <option value="2025" selected>2025</option>
                        <option value="2026">2026</option>
                    </select>
                </div>
            </div>
        </div>

            <div class="section-title">
                <span class="section-icon">📝</span>
                Calificaciones
            </div>
            
            <!-- Modo Numérico (4° a 7° grado) -->
            <div id="modoNumerico" style="display: none;">
                <div class="form-row">
                    <div class="form-group">
                        <label for="notaPDL
